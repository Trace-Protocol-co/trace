services:
  - type: web
    name: trace-api
    runtime: node
    region: oregon
    plan: free
    buildCommand: npm install && npm run build
    startCommand: node dist/middleware/server.js
    healthCheckPath: /v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: TRACE_PACKAGE_ID
        value: 0x3eff0f24ece1bd96bef48ba534eb498331a87cb1fb90d30de5bf1ec940cc648e
      - key: TRACE_TREASURY_ID
        value: 0x5dcd795b9b23e0344608b92d58f2a0c0438558243ce5db9c821292f90df9a54a
      - key: WALRUS_PUBLISHER
        value: https://publisher.walrus-testnet.walrus.space
      - key: WALRUS_AGGREGATOR
        value: https://aggregator.walrus-testnet.walrus.space
      - key: WALRUS_EXPLORER
        value: https://walruscan.com/testnet/blob
      - key: WALRUS_EPOCHS
        value: 5
      - key: ALLOWED_ORIGINS
        value: http://www.traceprotocol.co,https://www.traceprotocol.co,http://localhost:5173
      - key: APP_URL
        value: http://www.traceprotocol.co
      # ── x402 / OKX.AI ASP payment config ──────────────────────────────────
      - key: X402_PAY_TO
        value: "0x00dC0f3ff1F2bca6b3d007684cC25a766c9815f4"
      - key: X402_PRICE
        value: "0"
      - key: X402_NETWORK
        value: eip155:196
      - key: X402_ASSET
        value: "0x779ded0c9e1022225f8e0630b35a9b54be713736"
      # Set to the OKX OnchainOS facilitator URL to verify+settle on-chain.
      # Leave unset for direct-accept (fee 0) mode.
      - key: X402_FACILITATOR_URL
        sync: false
      - key: TRACE_PRIVATE_KEY
        sync: false